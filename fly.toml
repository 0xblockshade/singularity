# Fly.io config for Infinitum — one small always-on machine running the API, the
# in-process daily-wake scheduler, AND the built React UI (same origin, no CORS).
#
# Build context is the REPO ROOT, because the image builds the frontend too.
# Deploy from the repo root with:
#
#     fly deploy
#
# Before the first deploy:
#   fly volumes create infinitum_data --size 1 --region iad
#   fly secrets set ANTHROPIC_API_KEY=... INFINITUM_ADMIN_TOKEN=...

app = "infinitum-narrator"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"   # root Dockerfile, root context

[env]
  PORT = "8000"
  INFINITUM_DATA = "/data"
  INFINITUM_DB = "/data/infinitum.db"
  INFINITUM_FRONTEND_DIST = "/app/frontend/dist"
  # Autonomy on: this machine wakes the narrator once a day in-process.
  INFINITUM_ENABLE_SCHEDULER = "true"
  INFINITUM_WAKE_HOUR = "9"
  INFINITUM_TZ = "UTC"
  # Secrets (ANTHROPIC_API_KEY, INFINITUM_ADMIN_TOKEN) are NOT set here —
  # set them with `fly secrets set ...`.

# Persistent volume for the SQLite DB (WAL). Create once:
#   fly volumes create infinitum_data --size 1 --region iad
[mounts]
  source = "infinitum_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  # Keep the single machine alive so the scheduler can fire — do NOT auto-stop to zero.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

  [http_service.http_check]
    path = "/api/status"
    interval = "30s"
    timeout = "5s"

# One small always-on machine. A single machine avoids double-firing the daily wake.
[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
